version: '3.9'

# ═══════════════════════════════════════════════════════════════════════════════
# VESTRA — Production Docker Compose
# AI-Powered Property Trust & Operating System for Africa
# ═══════════════════════════════════════════════════════════════════════════════
#
# Quick start:
#   1. Copy .env.production.template to .env and fill in all secrets
#   2. docker-compose up -d
#   3. Visit http://localhost:3000 (app) or http://localhost:3001 (monitoring)
#
# Services:
#   - postgres         : PostgreSQL 16 (primary database)
#   - redis            : Redis 7 (cache, sessions, rate limiting)
#   - backend          : FastAPI (API server, port 8000)
#   - frontend         : Next.js (Web app, port 3000)
#   - nginx            : Reverse proxy (port 80/443)
#   - prometheus       : Metrics collection (port 9090)
#   - grafana          : Monitoring dashboards (port 3001)
#   - alertmanager     : Alert routing (port 9093)
#   - node-exporter    : Host metrics (port 9100)
#   - redis-exporter   : Redis metrics (port 9121)
#   - postgres-exporter: PostgreSQL metrics (port 9187)
#   - worker           : Background task processor
#   - flower           : Celery task monitor (port 5555)
#
# Production features:
#   - Resource limits + reservations for all services
#   - Health checks with proper start periods and retries
#   - JSON-file logging with rotation (prevents disk overflow)
#   - Graceful shutdown with extended stop periods
#   - Rolling update strategy for zero-downtime deploys
#   - Proper init process for signal handling (PID 1 reaper)
#   - Least-privilege security for non-essential containers
#   - Internal bridge network with isolated subnet
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vestra_postgres
    restart: unless-stopped
    init: true  # Proper PID 1 reaper for signal handling and zombie cleanup
    stop_grace_period: 60s  # Give PostgreSQL time to flush WAL and shut down cleanly
    environment:
      POSTGRES_DB: vestra
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Enable data checksums for corruption detection (PostgreSQL 16+)
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Preload pg_stat_statements for query performance monitoring
      PGOPTIONS: "-c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c pg_stat_statements.max=10000"
    ports:
      - "127.0.0.1:5432:5432"  # Localhost-only binding for security
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d vestra && pg_isready -U ${POSTGRES_USER:-postgres} -d vestra -q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s  # Allow PostgreSQL to initialize before health checks begin
    deploy:
      # Restart policy: explicit conditions for container orchestration
      restart_policy:
        condition: unless-stopped
        delay: 5s
        max_attempts: 3
        window: 120s
      # Rolling update: one container at a time
      update_config:
        order: stop-first
        failure_action: rollback
        delay: 10s
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    # Security: drop all capabilities, add only what PostgreSQL needs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    networks:
      - vestra_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vestra_redis
    restart: unless-stopped
    init: true
    stop_grace_period: 30s  # Give Redis time to flush AOF and save RDB
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --loglevel notice
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      restart_policy:
        condition: unless-stopped
        delay: 5s
        max_attempts: 3
        window: 60s
      update_config:
        order: stop-first
        failure_action: rollback
        delay: 5s
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    networks:
      - vestra_internal
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vestra-backend:${APP_VERSION:-4.0.0}  # Tagged image for version tracking
    container_name: vestra_backend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s  # Allow in-flight requests to complete
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/vestra?ssl=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      BASE_URL: ${BASE_URL:-http://localhost}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "false"
      APP_NAME: ${APP_NAME:-Vestra}
      APP_VERSION: ${APP_VERSION:-4.0.0}
      PROMETHEUS_ENABLED: "true"
      HEALTH_CHECK_TOKEN: ${HEALTH_CHECK_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_BACKLOG: ${GUNICORN_BACKLOG:-2048}
      GUNICORN_WORKER_CONNECTIONS: ${GUNICORN_WORKER_CONNECTIONS:-1000}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-10000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-1000}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-10}
      GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-5}
      GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      AIRTEL_CLIENT_ID: ${AIRTEL_CLIENT_ID:-}
      AIRTEL_CLIENT_SECRET: ${AIRTEL_CLIENT_SECRET:-}
      AIRTEL_ENV: ${AIRTEL_ENV:-sandbox}
      AIRTEL_CALLBACK_URL: ${AIRTEL_CALLBACK_URL:-}
      CRYPTO_WALLET_ADDRESS_USDT: ${CRYPTO_WALLET_ADDRESS_USDT:-}
      CRYPTO_RPC_URL: ${CRYPTO_RPC_URL:-https://polygon-rpc.com}
      CRYPTO_ENABLED: ${CRYPTO_ENABLED:-false}
      BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:-Vestra Technologies Ltd}
      BANK_ACCOUNT_NUMBER_KCB: ${BANK_ACCOUNT_NUMBER_KCB:-}
      BANK_ACCOUNT_NUMBER_EQUITY: ${BANK_ACCOUNT_NUMBER_EQUITY:-}
      BANK_ACCOUNT_NUMBER_COOP: ${BANK_ACCOUNT_NUMBER_COOP:-}
      BANK_ACCOUNT_NUMBER_NCBA: ${BANK_ACCOUNT_NUMBER_NCBA:-}
      BANK_ACCOUNT_NUMBER_ABSA: ${BANK_ACCOUNT_NUMBER_ABSA:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@vestra.co.ke}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Vestra}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_BUSINESS_ID: ${WHATSAPP_BUSINESS_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
      MAX_CONCURRENT_SESSIONS: ${MAX_CONCURRENT_SESSIONS:-5}
      ACCOUNT_LOCKOUT_MAX_ATTEMPTS: ${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:-5}
      ACCOUNT_LOCKOUT_DURATION_MINUTES: ${ACCOUNT_LOCKOUT_DURATION_MINUTES:-15}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_GENERAL_PER_MINUTE: ${RATE_LIMIT_GENERAL_PER_MINUTE:-120}
      RATE_LIMIT_ADMIN_PER_MINUTE: ${RATE_LIMIT_ADMIN_PER_MINUTE:-300}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      CSP_ENABLED: ${CSP_ENABLED:-true}
      CSRF_ENABLED: ${CSRF_ENABLED:-true}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      # Use Python's standard library for a minimal, dependency-free health check
      test: ["CMD", "python", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      restart_policy:
        condition: unless-stopped
        delay: 10s
        max_attempts: 5
        window: 120s
      # Rolling update: spin up new container first, then stop old one (zero-downtime)
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
        max_parallel: 1
        delay: 10s
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.75"
          memory: 512M
      labels:
        - "app.name=Vestra"
        - "app.component=backend"
        - "app.environment=${ENVIRONMENT:-production}"
        - "app.version=${APP_VERSION:-4.0.0}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Allow binding to privileged ports if needed
      - SETGID
      - SETUID
    networks:
      - vestra_internal
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-build
      dockerfile: Dockerfile
    image: vestra-frontend:${APP_VERSION:-4.0.0}
    container_name: vestra_frontend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Vestra}
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-4.0.0}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
      NEXT_PUBLIC_ENABLE_CRYPTO: ${NEXT_PUBLIC_ENABLE_CRYPTO:-false}
      NEXT_PUBLIC_ENABLE_WHATSAPP: ${NEXT_PUBLIC_ENABLE_WHATSAPP:-false}
      NEXT_PUBLIC_ENABLE_AI_CHAT: ${NEXT_PUBLIC_ENABLE_AI_CHAT:-true}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_started  # Frontend can start before backend is healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      restart_policy:
        condition: unless-stopped
        delay: 10s
        max_attempts: 3
        window: 60s
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
        delay: 10s
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
      labels:
        - "app.name=Vestra"
        - "app.component=frontend"
        - "app.environment=${ENVIRONMENT:-production}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    networks:
      - vestra_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: vestra_nginx
    restart: unless-stopped
    init: true
    stop_grace_period: 10s  # Nginx shuts down quickly — existing connections drain fast
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      grafana:
        condition: service_started
    healthcheck:
      # Test that nginx is actually serving HTTP, not just that config is valid
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health", "||", "exit", "0"]
      # Alternative: use the status endpoint if nginx_status module is enabled:
      # test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/nginx_status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      restart_policy:
        condition: unless-stopped
        delay: 5s
        max_attempts: 3
        window: 30s
      update_config:
        order: stop-first
        failure_action: rollback
        delay: 5s
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - CHOWN
    networks:
      - vestra_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: vestra_prometheus
    restart: unless-stopped
    init: true
    stop_grace_period: 30s  # Wait for WAL to flush
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.external-url=/prometheus'
      - '--web.route-prefix=/prometheus'
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_started
      node-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
      postgres-exporter:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9090/-/ready", "-O", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      restart_policy:
        condition: unless-stopped
        delay: 10s
        max_attempts: 3
        window: 60s
      update_config:
        order: stop-first
        failure_action: rollback
        delay: 10s
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - CHOWN
    networks:
      - vestra_internal
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.4.0
    container_name: vestra_grafana
    restart: unless-stopped
    init: true
    stop_grace_period: 30s  # Wait for dashboards to save
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/vestra-system-overview.json
      GF_SMTP_ENABLED: "${SMTP_HOST:+true}"
      GF_SMTP_HOST: "${SMTP_HOST:-}"
      GF_SMTP_USER: "${SMTP_USER:-}"
      GF_SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      GF_SMTP_FROM_ADDRESS: "${SMTP_FROM_EMAIL:-noreply@vestra.co.ke}"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "true"
      GF_FEATURE_TOGGLES_ENABLE: "alertingSimplifiedRouting"
      GF_AUTH_BASIC_ENABLED: "true"  # Require basic auth for dashboard access
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:3000/api/health", "-O", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      restart_policy:
        condition: unless-stopped
        delay: 10s
        max_attempts: 3
        window: 60s
      update_config:
        order: stop-first
        failure_action: rollback
        delay: 10s
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - CHOWN
    networks:
      - vestra_internal
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

  # ── Alertmanager ────────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: vestra_alertmanager
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--web.external-url=/alertmanager'
      - '--web.route-prefix=/alertmanager'
      - '--storage.path=/alertmanager'
      - '--data.retention=120h'  # Keep resolved alerts for 5 days
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9093/-/healthy", "-O", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      restart_policy:
        condition: unless-stopped
        delay: 10s
        max_attempts: 3
        window: 60s
      update_config:
        order: stop-first
        failure_action: rollback
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - CHOWN
    networks:
      - vestra_internal
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Node Exporter (host metrics) ────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: vestra_node_exporter
    restart: unless-stopped
    init: true
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run)($$|/)'
      - '--collector.systemd'
      - '--collector.processes'
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    pid: host
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9100/metrics", "-O", "/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - vestra_internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis Exporter ──────────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.64.0
    container_name: vestra_redis_exporter
    restart: unless-stopped
    init: true
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9121/metrics", "-O", "/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - vestra_internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── PostgreSQL Exporter ─────────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: vestra_postgres_exporter
    restart: unless-stopped
    init: true
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/vestra?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9187/metrics", "-O", "/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - vestra_internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Background Worker ─────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vestra-worker:${APP_VERSION:-4.0.0}
    container_name: vestra_worker
    restart: unless-stopped
    init: true
    stop_grace_period: 60s  # Wait for current task batch to finish
    command: python -m app.workers.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/vestra?ssl=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      WORKERS: ${BG_WORKERS:-4}
      BATCH_SIZE: ${BG_BATCH_SIZE:-5}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@vestra.co.ke}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Check that the worker can connect to Redis (its primary dependency)
      test: ["CMD", "python", "-c", "import redis; r=redis.Redis.from_url('${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}'); r.ping(); print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      restart_policy:
        condition: unless-stopped
        delay: 10s
        max_attempts: 5
        window: 120s
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 30s
        delay: 10s
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
      labels:
        - "app.name=Vestra"
        - "app.component=worker"
        - "app.environment=${ENVIRONMENT:-production}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    networks:
      - vestra_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── Flower (Celery monitor) ─────────────────────────────────────────────────
  flower:
    image: mher/flower:2.0.1
    container_name: vestra_flower
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    command:
      - 'celery'
      - '--broker=${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD}@redis:6379/1}'
      - 'flower'
      - '--port=5555'
      - '--url_prefix=flower'
      - '--basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD must be set}'  # Require auth
      - '--max_tasks=10000'
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:5555/flower", "-O", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      restart_policy:
        condition: unless-stopped
        delay: 5s
        max_attempts: 3
        window: 30s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    networks:
      - vestra_internal
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  vestra_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
    # Enable attachable for external containers that need to join this network
    # Useful for one-off migration containers or debug tools
    driver_opts:
      com.docker.network.bridge.name: "vestra0"
    labels:
      - "app.name=Vestra"
      - "app.component=network"
      - "app.environment=${ENVIRONMENT:-production}"

volumes:
  postgres_data:
    driver: local
    labels:
      - "app.name=Vestra"
      - "app.component=postgres-data"
  redis_data:
    driver: local
  uploads_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  nginx_cache:
    driver: local
