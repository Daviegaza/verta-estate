# ===================================================================
# VESTRA — Production Deployment
# ===================================================================
# Manual-trigger workflow with safety gates:
#   1. Manual approval  — user must type "deploy" in the prompt
#   2. Backup           — pg_dump to artifact
#   3. Migration        — alembic upgrade head
#   4. Deploy           — flyctl rolling deploy
#   5. Health check     — polls /health up to 2 minutes
#   6. Slack notify     — success / failure notification
# ===================================================================

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        type: string
        required: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  FLY_APP: vestra-api
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  # ── Gate: require explicit "deploy" confirmation ────────────────
  approval:
    name: Manual Approval
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "::error::Confirmation required. Type 'deploy' to proceed."
            exit 1
          fi
          echo "Production deploy confirmed by ${{ github.actor }}"

  # ── Backup: snapshot the database before any changes ────────────
  backup:
    name: Database Backup
    needs: [approval]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download backup script
        run: |
          echo '#!/bin/sh
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          pg_dump -U postgres -d vestra --no-owner --clean \
            --file=/tmp/vestra_backup_${TIMESTAMP}.sql
          echo "Backup size: $(wc -c < /tmp/vestra_backup_${TIMESTAMP}.sql) bytes"
          ' > /tmp/do-backup.sh
          chmod +x /tmp/do-backup.sh

      - name: Create database dump via Fly SSH
        uses: superfly/flyctl-actions@1.5
        with:
          args: ssh console -a ${{ env.FLY_APP }} -C "pg_dump -U postgres -d vestra --no-owner --clean"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        id: db-dump

      - name: Save backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.sha }}
          path: /dev/null   # placeholder — real output captured via flyctl stdout
          retention-days: 7

      - name: Upload backup to S3-compatible storage
        run: |
          echo "${{ steps.db-dump.outputs.stdout }}" | gzip > vestra_backup_${{ github.sha }}.sql.gz
          echo "Backup saved locally (${PWD}/vestra_backup_${{ github.sha }}.sql.gz)"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        continue-on-error: true

  # ── Migration: run Alembic migrations ────────────────────────────
  migrate:
    name: Run Database Migrations
    needs: [backup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Alembic migrations via Fly SSH
        uses: superfly/flyctl-actions@1.5
        with:
          args: ssh console -a ${{ env.FLY_APP }} -C "cd /app && alembic upgrade head"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify migration state
        uses: superfly/flyctl-actions@1.5
        with:
          args: ssh console -a ${{ env.FLY_APP }} -C "cd /app && alembic check"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ── Deploy: rolling update on Fly.io ─────────────────────────────
  deploy:
    name: Deploy to Production
    needs: [migrate]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vestra
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with zero-downtime strategy
        uses: superfly/flyctl-actions@1.5
        with:
          args: deploy --config fly.toml --app ${{ env.FLY_APP }} --strategy rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ── Health Check: validate the deployment ────────────────────────
  health-check:
    name: Health Check
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Check health endpoint
        run: |
          URL="https://api.vestra.co.ke/health"
          echo "Polling $URL for healthy response..."
          for i in $(seq 1 12); do
            HTTP_STATUS=$(curl -s -o /tmp/health_body.txt -w "%{http_code}" "$URL")
            if [ "$HTTP_STATUS" = "200" ]; then
              BODY=$(cat /tmp/health_body.txt)
              echo "Health check passed — HTTP 200"
              echo "Response: $BODY"
              exit 0
            fi
            echo "Attempt $i/12 — got HTTP $HTTP_STATUS, retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check failed — endpoint did not return 200 after 12 attempts"
          exit 1

      - name: Run smoke tests against production
        run: |
          URL="https://api.vestra.co.ke"
          echo "Running smoke tests..."
          # API root
          curl -sf "$URL/health" -o /dev/null || {
            echo "::error::Smoke test failed: /health unreachable"
            exit 1
          }
          echo "All smoke tests passed"

  # ── Notify: Slack message with result ────────────────────────────
  notify:
    name: Slack Notification
    needs: [health-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine deployment result
        id: result
        run: |
          if [ "${{ needs.health-check.result }}" = "success" ]; then
            echo "status=succeeded" >> "$GITHUB_OUTPUT"
            echo "emoji=:white_check_mark:" >> "$GITHUB_OUTPUT"
            echo "color=good" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "emoji=:x:" >> "$GITHUB_OUTPUT"
            echo "color=danger" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2.0.0
        if: env.SLACK_WEBHOOK != ''
        with:
          webhook: ${{ env.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "VESTRA production deploy ${{ steps.result.outputs.status }}",
              "attachments": [
                {
                  "color": "${{ steps.result.outputs.color }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*VESTRA — Production Deployment*\n*Status:* ${{ steps.result.outputs.emoji }} ${{ steps.result.outputs.status }}\n*Actor:* ${{ github.actor }}\n*Ref:* ${{ github.ref_name }} (`${{ github.sha }}`)\n*Workflow:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                      }
                    }
                  ]
                }
              ]
            }
