name: VESTRA CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: Unit Tests + Lint + Security ─────────────────────────────────
  backend:
    name: Backend — Python 3.12
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vestra_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vestra/backend/requirements.txt

      - name: Install dependencies
        run: |
          cd vestra/backend
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile check (syntax)
        run: |
          cd vestra/backend
          python -m compileall app/

      - name: Lint (ruff)
        run: |
          cd vestra/backend
          ruff check app/ tests/
          ruff format --check app/ tests/

      - name: Security audit (bandit)
        run: |
          cd vestra/backend
          bandit -r app/ -ll -c pyproject.toml

      - name: Type check (mypy)
        run: |
          cd vestra/backend
          mypy app/ --ignore-missing-imports --no-strict-optional || true

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vestra_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-unit-tests
          ENVIRONMENT: test
        run: |
          cd vestra/backend
          python -m pytest tests/unit/ -v --tb=short --cov=app --cov-report=xml --cov-report=term

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vestra_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-integration
          ENVIRONMENT: test
        run: |
          cd vestra/backend
          python -m pytest tests/test_*.py -v --tb=short --timeout=120 -p no:warnings

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: vestra/backend/coverage.xml

  # ── Database Migration Test ───────────────────────────────────────────────
  migration-test:
    name: Migration Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vestra_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vestra/backend/requirements.txt

      - name: Install dependencies
        run: |
          cd vestra/backend
          pip install -r requirements.txt

      - name: Test migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vestra_test
        run: |
          cd vestra/backend
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  # ── Frontend: Lint + Type Check + Unit Tests ──────────────────────────────
  frontend:
    name: Frontend — Node.js 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vestra/frontend-build/package-lock.json

      - name: Install dependencies
        run: |
          cd vestra/frontend-build
          npm ci

      - name: TypeScript check
        run: |
          cd vestra/frontend-build
          npx tsc --noEmit

      - name: Lint
        run: |
          cd vestra/frontend-build
          npm run lint

      - name: Unit tests (vitest)
        run: |
          cd vestra/frontend-build
          npx vitest run --coverage

      - name: Build
        run: |
          cd vestra/frontend-build
          npm run build

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: vestra/frontend-build/coverage/

  # ── E2E Tests ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vestra/frontend-build/package-lock.json

      - name: Install dependencies
        run: |
          cd vestra/frontend-build
          npm ci

      - name: Install Playwright browsers
        run: |
          cd vestra/frontend-build
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          cd vestra/frontend-build
          npx playwright test
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: vestra/frontend-build/playwright-report/

  # ── Docker Build ──────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend, migration-test]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          cd vestra
          docker build -t vestra-api:latest -f backend/Dockerfile backend/

      - name: Build frontend image
        run: |
          cd vestra
          docker build -t vestra-frontend:latest frontend-build/

      - name: Container security scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vestra-api:latest
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

  # ── Deploy to Fly.io ──────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
