# ═══════════════════════════════════════════════════════════════════════════════
# VESTRA — Prometheus Configuration
# ═══════════════════════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: ${ENVIRONMENT:-production}
    service: vestra

# Alert rules
rule_files:
  - /etc/prometheus/alerts.yml

# Scrape configurations
scrape_configs:
  # ── Vestra Backend API ──────────────────────────────────────────────────────
  - job_name: vestra-backend
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - backend:8000
        labels:
          component: api
          app: vestra
    scrape_interval: 10s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: vestra_.*
        action: keep

  # ── Node Exporter (host system metrics) ─────────────────────────────────────
  - job_name: node
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          component: host
    scrape_interval: 30s

  # ── Redis Exporter ──────────────────────────────────────────────────────────
  - job_name: redis
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          component: cache
    scrape_interval: 30s

  # ── PostgreSQL Exporter ─────────────────────────────────────────────────────
  - job_name: postgres
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          component: database
    scrape_interval: 30s

  # ── Nginx (if stub_status enabled) ──────────────────────────────────────────
  - job_name: nginx
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - nginx:80
        labels:
          component: proxy
    scrape_interval: 30s
