# ===================================================================
# VESTRA — Continuous Integration
# ===================================================================
# Runs on every push (main, develop) and every PR against main.
#
# Jobs:
#   backend-tests   — Python 3.12, PostgreSQL + Redis services, pytest
#   frontend-tests  — Node 20, typecheck, lint, vitest
#   e2e-tests       — docker-compose up, Playwright, docker-compose down
#   deploy-staging  — flyctl deploy on main branch pushes
# ===================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  COMPOSE_FILE: vestra/docker-compose.yml

# ───────────────────────────────────────────────────────────────────
# BACKEND TESTS
# ───────────────────────────────────────────────────────────────────
jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vestra/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vestra_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vestra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vestra/backend/requirements*.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check . --output-format=github

      - name: Type check with mypy
        run: mypy app --show-error-codes
        continue-on-error: true

      - name: Security scan with Bandit
        run: bandit -r app -x tests,alembic -ll
        continue-on-error: true

      - name: Run tests with pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vestra_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-not-for-production
          ENVIRONMENT: test
        run: |
          pytest --cov=app --cov-report=xml:coverage.xml --cov-report=term \
            -m "not slow" -v --timeout 120

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: vestra/backend/coverage.xml

  # ───────────────────────────────────────────────────────────────────
  # FRONTEND TESTS
  # ───────────────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vestra/frontend-build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vestra/frontend-build/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Run unit tests (vitest)
        run: npm test -- --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: vestra/frontend-build/coverage/

      # Cache .next for potential downstream use
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: vestra/frontend-build/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('vestra/frontend-build/package-lock.json') }}

  # ───────────────────────────────────────────────────────────────────
  # E2E TESTS (Playwright)
  # ───────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vestra

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vestra/frontend-build/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./vestra/frontend-build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
        working-directory: ./vestra/frontend-build

      - name: Start application services
        run: |
          docker compose -f docker-compose.yml up -d postgres redis backend
          echo "Waiting for backend to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            echo "Attempt $i/30 — backend not ready yet..."
            sleep 3
          done

      - name: Build and start frontend
        run: |
          cd frontend-build
          npm run build
          npm run start &
          echo "Waiting for frontend..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is ready"
              break
            fi
            echo "Attempt $i/20"
            sleep 3
          done
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./vestra/frontend-build
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: vestra/frontend-build/playwright-report/

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: vestra/frontend-build/test-results/

      - name: Tear down containers
        if: always()
        run: docker compose -f docker-compose.yml down -v

  # ───────────────────────────────────────────────────────────────────
  # DEPLOY STAGING (main branch only)
  # ───────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend-tests, frontend-tests, e2e-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vestra
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions@1.5
        with:
          args: deploy --config fly.toml --app vestra-api-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}

      - name: Health check after deploy
        run: |
          sleep 15
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://vestra-api-staging.fly.dev/health)
            if [ "$STATUS" = "200" ]; then
              echo "Staging health check passed"
              exit 0
            fi
            echo "Attempt $i/12 — got $STATUS, retrying..."
            sleep 10
          done
          echo "Staging health check failed"
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
