# VESTRA Pre-commit Hooks
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # ── Python: Ruff (lint + format) ──────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix]
        files: ^vestra/backend/
      - id: ruff-format
        name: ruff (format)
        files: ^vestra/backend/

  # ── Python: mypy (type checking) ──────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        name: mypy (type check)
        files: ^vestra/backend/
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - pydantic>=2.0.0
          - sqlalchemy>=2.0.0
          - types-redis
          - types-python-jose

  # ── Python: Bandit (security audit) ───────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: bandit (security)
        files: ^vestra/backend/
        args: [-c, vestra/backend/pyproject.toml, -ll, --recursive, vestra/backend/app]

  # ── General: trailing whitespace, file endings ────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1000]

  # ── Frontend: ESLint ──────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.0.0
    hooks:
      - id: eslint
        name: eslint (lint)
        files: ^vestra/frontend-build/
        types_or: [javascript, jsx, ts, tsx]
        args: [--fix]
        additional_dependencies:
          - eslint@9
          - eslint-config-next@16

  # ── Frontend: Prettier ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.0
    hooks:
      - id: prettier
        name: prettier (format)
        files: ^vestra/frontend-build/
        types_or: [javascript, jsx, ts, tsx, json, css, markdown]

  # ── General: secrets scanning ─────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: >
          (?x)^(
            vestra/backend/.env.example|
            vestra/frontend-build/.env.example|
            vestra/.env.production
          )$
