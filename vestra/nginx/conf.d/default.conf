# ── HTTP → HTTPS Redirect (comment out if no SSL) ────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt challenge (uncomment for SSL)
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    # Redirect to HTTPS (uncomment for SSL)
    # return 301 https://$host$request_uri;

    # Without SSL, serve directly
    include /etc/nginx/conf.d/routes.conf;
}

