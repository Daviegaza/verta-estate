# ═══════════════════════════════════════════════════════════════════════════════
# VESTRA — Nginx Reverse Proxy
# ═══════════════════════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────
    log_format json_combined escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"host":"$host",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log json_combined buffer=32k flush=5s;

    # ── Performance Tuning ─────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # ── Gzip Compression ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # ── Security Headers ───────────────────────────────────────────────────
    map $scheme $hsts_header {
        https "max-age=63072000; includeSubDomains; preload";
        default "";
    }

    # ── Rate Limiting Zones ────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Upstreams ──────────────────────────────────────────────────────────
    upstream vestra_backend {
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream vestra_frontend {
        server frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream vestra_grafana {
        server grafana:3000 max_fails=3 fail_timeout=10s;
    }

    # ── Include Site Configs ───────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
