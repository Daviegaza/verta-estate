# ═══════════════════════════════════════════════════════════════════════════════
# VESTRA — Nginx Route Configuration
# Shared between HTTP and HTTPS server blocks
# ═══════════════════════════════════════════════════════════════════════════════

# ── Security Headers (applied to all locations) ────────────────────────────
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;
add_header X-Correlation-ID $request_id always;

# ── Frontend (Next.js) ────────────────────────────────────────────────────
location / {
    limit_conn conn_limit 20;
    proxy_pass http://vestra_frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering on;
    proxy_cache_bypass $http_upgrade;
}

# ── Backend API ───────────────────────────────────────────────────────────
location /api/ {
    limit_req zone=api_limit burst=50 nodelay;
    limit_conn conn_limit 10;
    proxy_pass http://vestra_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 10m;
}

# ── Auth endpoints — stricter rate limiting ───────────────────────────────
location /api/auth/ {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://vestra_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
}

# ── M-Pesa callback — no rate limiting (Safaricom IPs only in prod) ──────
location /api/payments/mpesa/callback {
    proxy_pass http://vestra_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# ── Health checks (internal) ──────────────────────────────────────────────
location /health {
    proxy_pass http://vestra_backend;
    proxy_http_version 1.1;
    access_log off;
}

# ── API Docs (internal only in production) ────────────────────────────────
location /docs {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    proxy_pass http://vestra_backend;
    proxy_http_version 1.1;
}

location /redoc {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    proxy_pass http://vestra_backend;
    proxy_http_version 1.1;
}

# ── Prometheus metrics (internal only) ────────────────────────────────────
location /metrics {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    proxy_pass http://vestra_backend;
    proxy_http_version 1.1;
}

# ── Grafana ───────────────────────────────────────────────────────────────
location /grafana/ {
    proxy_pass http://vestra_grafana/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

# ── Grafana Live (WebSocket) ──────────────────────────────────────────────
location /grafana/api/live/ {
    proxy_pass http://vestra_grafana/api/live/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# ── Prometheus UI (internal only) ─────────────────────────────────────────
location /prometheus/ {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    proxy_pass http://vestra_prometheus:9090/prometheus/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# ── Alertmanager UI (internal only) ───────────────────────────────────────
location /alertmanager/ {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    proxy_pass http://vestra_alertmanager:9093/alertmanager/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# ── Flower (internal only) ────────────────────────────────────────────────
location /flower/ {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    proxy_pass http://vestra_flower:5555/flower/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# ── Deny hidden files ─────────────────────────────────────────────────────
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}
