name: VESTRA CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend Checks ──────────────────────────────────────────────────────────
  backend:
    name: Backend — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vestra_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: vestra/backend/requirements.txt

      - name: Install dependencies
        run: |
          cd vestra/backend
          pip install -r requirements.txt

      - name: Compile check (syntax)
        run: |
          cd vestra/backend
          python -m compileall app/

      - name: Security audit (bandit)
        run: |
          pip install bandit
          cd vestra/backend
          bandit -r app/ -ll -x venv/,__pycache__/

  # ── Frontend Checks ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Node.js
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vestra/frontend-build/package-lock.json

      - name: Install dependencies
        run: |
          cd vestra/frontend-build
          npm ci

      - name: TypeScript check
        run: |
          cd vestra/frontend-build
          npx tsc --noEmit

      - name: Lint
        run: |
          cd vestra/frontend-build
          npm run lint

      - name: Build
        run: |
          cd vestra/frontend-build
          npm run build

  # ── Docker Build ────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          cd vestra
          docker build -t vestra-api:latest -f backend/Dockerfile backend/

      - name: Build frontend image
        run: |
          cd vestra
          docker build -t vestra-frontend:latest frontend-build/

  # ── Deploy to Fly.io ────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
